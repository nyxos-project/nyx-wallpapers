# Which wallpapers belong to which Nyx theme. The theme service reads this: `default`
# is what a new install shows on the desktop and `lock` on the lock and login screens.
# The other keys are sets to choose from. Paths are relative to this repository.

[catppuccin-frappe]
default = "catppuccin-frappe/wordmark/nyx_wordmark_desktop_4K.png"
lock = "catppuccin-frappe/wordmark/nyx_wordmark_lock_4K.png"
wordmark = ["catppuccin-frappe/wordmark/nyx_wordmark_desktop_4K.png", "catppuccin-frappe/wordmark/nyx_wordmark_lock_4K.png"]

